# ============================================================
# BlogSphere API - Application Configuration
# ============================================================

spring.application.name=BlogSphere-API

# ======================== SERVER ========================
server.port=8080
server.servlet.context-path=/

# ======================== DATABASE ========================
spring.datasource.url=jdbc:mysql://localhost:3306/blogsphere_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ======================== JPA / HIBERNATE ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ======================== JWT CONFIGURATION ========================
app.jwt.secret=blogsphere-super-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm
app.jwt.expiration=86400000
# 86400000 ms = 24 hours

# ======================== FILE UPLOAD ========================
app.file.upload-dir=./uploads/images
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ======================== SWAGGER / OPENAPI ========================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ======================== LOGGING ========================
logging.level.com.blogsphere=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ======================== PAGINATION DEFAULTS ========================
app.pagination.default-page-number=0
app.pagination.default-page-size=10
app.pagination.default-sort-by=createdAt
app.pagination.default-sort-dir=desc
