# ============================================================
# BlogSphere API - Application Configuration
# ============================================================

spring.application.name=BlogSphere-API

# ======================== SERVER ========================
server.port=${PORT:8080}
server.servlet.context-path=/

# ======================== DATABASE ========================
# Supports MySQL, PostgreSQL, or H2 via SPRING_DATASOURCE_URL environment variable
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/blogsphere_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# Connection Pool
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ======================== JPA / HIBERNATE ========================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ======================== JWT CONFIGURATION ========================
app.jwt.secret=${APP_JWT_SECRET:blogsphere-super-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}

# ======================== CORS CONFIGURATION ========================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://ankitydv098.github.io}

# ======================== FILE UPLOAD ========================
app.file.upload-dir=${APP_FILE_UPLOAD_DIR:./uploads/images}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ======================== SWAGGER / OPENAPI ========================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ======================== ACTUATOR HEALTH CHECK ========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ======================== LOGGING ========================
logging.level.com.blogsphere=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN

# ======================== PAGINATION DEFAULTS ========================
app.pagination.default-page-number=0
app.pagination.default-page-size=10
app.pagination.default-sort-by=createdAt
app.pagination.default-sort-dir=desc

