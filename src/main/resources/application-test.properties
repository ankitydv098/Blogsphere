# ============================================================
# BlogSphere API - Test Configuration (H2 In-Memory)
# ============================================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

app.jwt.secret=test-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm-testing
app.jwt.expiration=86400000

app.file.upload-dir=./test-uploads/images

logging.level.com.blogsphere=INFO
logging.level.org.springframework.security=WARN
