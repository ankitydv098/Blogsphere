<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>BlogSphere</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect trick.
      // When GitHub Pages serves a 404 for a deep link (e.g. /Blogsphere/posts/5),
      // it actually serves this 404.html page. We encode the full path into a query
      // param and redirect to the base index.html, which then decodes it back.
      // See: https://github.com/rafgraph/spa-github-pages
      var segmentCount = 1; // 1 = one path segment for the repo sub-folder (/Blogsphere)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
